<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Replylane</title>
    <link rel="stylesheet" href="/app.css" />
  </head>
  <body>
    <header class="top">
      <div>
        <p class="mark">Replylane</p>
        <h1>Draft the reply from your own help articles.</h1>
      </div>
      <p id="plan" class="plan">Loading workspace…</p>
    </header>
    <main>
      <section class="panel">
        <label for="message">Customer message</label>
        <textarea id="message" rows="7" placeholder="Where is my invoice for last month?"></textarea>
        <div class="row">
          <button id="draft" type="button">Draft reply</button>
          <p id="status"></p>
        </div>
      </section>
      <section class="panel">
        <h2>Draft</h2>
        <pre id="reply">The reply will show up here.</pre>
        <p id="sources"></p>
      </section>
    </main>
    <script>
      const plan = document.querySelector("#plan");
      const status = document.querySelector("#status");
      const reply = document.querySelector("#reply");
      const sources = document.querySelector("#sources");
      async function loadWorkspace() {
        const response = await fetch("/api/workspace");
        const data = await response.json();
        plan.textContent = data.name + " · " + data.plan + " · " + data.articleCount + " articles";
      }
      document.querySelector("#draft").addEventListener("click", async () => {
        status.textContent = "Drafting…";
        const response = await fetch("/api/drafts", {
          method: "POST",
          headers: { "content-type": "application/json" },
          body: JSON.stringify({ message: document.querySelector("#message").value }),
        });
        const data = await response.json();
        if (!data.ok) {
          status.textContent = data.error;
          return;
        }
        reply.textContent = data.reply;
        sources.textContent = data.sources.length ? "From " + data.sources.join(", ") : "No matching article";
        status.textContent = data.remaining + " drafts left today";
      });
      loadWorkspace();
    </script>
  </body>
</html>
